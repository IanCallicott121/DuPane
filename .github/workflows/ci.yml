name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build 2>&1 | tail -5

      - name: Run unit tests
        run: swift test --filter DuPaneUITests 2>&1

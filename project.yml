name: DuPane
options:
  bundleIdPrefix: local
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: false
  defaultConfig: Debug

fileGroups:
  - Docs
  - Package.swift
  - project.yml

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20

targets:
  DuPane:
    type: application
    platform: macOS
    sources:
      - path: Sources/DuPane
      - path: Docs/UserGuide.html
        buildPhase: resources
      - path: Docs/FAQs.html
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    postBuildScripts:
      - name: "Stamp Build Number"
        showEnvVarsInLog: false
        script: |
          BUILD_FILE="${SRCROOT}/BuildNumber.txt"
          BUILD=$(cat "$BUILD_FILE")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}" 2>/dev/null || true
          GUIDE_FILE="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/UserGuide.html"
          VERSION="${MARKETING_VERSION:-1.0}"
          /usr/bin/sed -i '' "s/{{BUILD}}/${BUILD}/g; s/{{VERSION}}/${VERSION}/g" "$GUIDE_FILE"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.DuPane
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/DuPane.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          ENABLE_TESTABILITY: YES
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

  DuPaneEndToEndUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/DuPaneEndToEndUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.DuPane.EndToEndUITests
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: DuPane
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DuPane
        embed: false

schemes:
  DuPane:
    build:
      targets:
        DuPane: all
        DuPaneEndToEndUITests: testing
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DuPaneEndToEndUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

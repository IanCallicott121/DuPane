name: DOpusMac
options:
  bundleIdPrefix: local
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: false
  defaultConfig: Debug

fileGroups:
  - Docs
  - Package.swift
  - project.yml

targets:
  DOpusMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/DOpusMac
    postBuildScripts:
      - name: "Increment Build Number"
        showEnvVarsInLog: false
        script: |
          BUILD_FILE="${SRCROOT}/BuildNumber.txt"
          if [ ! -f "$BUILD_FILE" ]; then echo "0" > "$BUILD_FILE"; fi
          BUILD=$(cat "$BUILD_FILE")
          BUILD=$((BUILD + 1))
          printf "%d" "$BUILD" > "$BUILD_FILE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.DOpusMac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/DOpusMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          ENABLE_TESTABILITY: YES
        Release:
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

  DOpusMacEndToEndUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests/DOpusMacEndToEndUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.DOpusMac.EndToEndUITests
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: DOpusMac
    dependencies:
      - target: DOpusMac
        embed: false

schemes:
  DOpusMac:
    build:
      targets:
        DOpusMac: all
        DOpusMacEndToEndUITests: testing
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DOpusMacEndToEndUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
